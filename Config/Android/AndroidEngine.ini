[SystemSettings]
; Path debug lines are expensive on mobile (line batch rebuild every tick).
; Default OFF on Android; toggle from the debug panel or:
;   adb shell am broadcast -a android.intent.action.RUN -e cmd "sfn.DrawPathDebug 1"
sfn.DrawPathDebug=0
sfn.ShowNavHUD=1
; On-device touch debug panel: pause/resume, path-line toggle, stat/dump buttons.
sfn.ShowDebugPanel=1
; Start paused so debug options can be set before agents begin moving (resume from the panel).
sfn.StartPaused=1
